name: Build GLM-5.3 Mooncake registration fix image

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: glm53-mooncake0311-02b4aae9-image
  cancel-in-progress: false

jobs:
  build-glm53-clean-image:
    if: github.repository == 'bytedance-iaas/sglang'
    environment: prod
    runs-on: x64-docker-build-node
    timeout-minutes: 240
    env:
      SOURCE_COMMIT: 02b4aae9df12a5f690cdda1fa5c409c05479abc7
      SOURCE_TREE: 57f86d431b885197bd8c8f8aa7d66a6321e2f382
      BUILD_DEFINITION_COMMIT: ${{ github.sha }}
      IMAGE_TAG: glm53-mooncake0311-02b4aae9-${{ github.run_id }}-${{ github.run_attempt }}
      VOLCENGINE_CR_REGISTRY: ${{ vars.VOLCENGINE_CR_REGISTRY }}
      VOLCENGINE_CR_NAMESPACE: ${{ vars.VOLCENGINE_CR_NAMESPACE }}
      VOLCENGINE_CR_REPOSITORY: ${{ vars.VOLCENGINE_CR_REPOSITORY || 'sglang' }}
      VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
      VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
    steps:
      - name: Clean build workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Check out GLM-5.3 build definition
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.BUILD_DEFINITION_COMMIT }}
          fetch-depth: 0

      - name: Verify source identity and K1 payload
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_DEFINITION_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$SOURCE_TREE"
          # Keep the proven Dockerfile fixes while pinning all runtime content.
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- . \
            ':!docker/Dockerfile' \
            ':!.github/workflows/bytedance-release-docker-dev.yml'
          test -f python/sglang/kernels/jit/csrc/deepseek_v4/topk_v2.cuh
          test -f python/sglang/kernels/jit/include/sgl_kernel/deepseek_v4/topk_impl.cuh
          python_manifest_sha256="$(python3 - <<'PY'
          import hashlib
          import subprocess

          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "python"]
          ).split(b"\0")
          digest = hashlib.sha256()
          for path in sorted(path for path in paths if path):
              digest.update(path)
              digest.update(b"\0")
              with open(path, "rb") as source_file:
                  digest.update(hashlib.sha256(source_file.read()).digest())
          print(digest.hexdigest())
          PY
          )"
          echo "python_manifest_sha256=$python_manifest_sha256" >> "$GITHUB_OUTPUT"

      - name: Resolve private image target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VOLCENGINE_CR_REGISTRY"
          test -n "$VOLCENGINE_CR_NAMESPACE"
          image_repo="$VOLCENGINE_CR_REGISTRY/$VOLCENGINE_CR_NAMESPACE/$VOLCENGINE_CR_REPOSITORY"
          echo "IMAGE_REPO=$image_repo" >> "$GITHUB_ENV"
          echo "REGISTRY_HOST=$VOLCENGINE_CR_REGISTRY" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["127.0.0.1:5000"]

      - name: Log in to Volcengine CR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$VOLCENGINE_CR_PASSWORD" | docker login "$REGISTRY_HOST" --username "$VOLCENGINE_CR_USERNAME" --password-stdin

      - name: Build and push clean CUDA 13 image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          build_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          docker buildx build \
            --target framework_final \
            --platform linux/amd64 \
            --output "type=image,name=$IMAGE_REPO,push-by-digest=true,name-canonical=true,push=true" \
            --file docker/Dockerfile \
            --build-arg CUDA_VERSION=13.0.1 \
            --build-arg BUILD_TYPE=all \
            --build-arg MOONCAKE_VERSION=0.3.11.post1 \
            --build-arg UBUNTU_MIRROR=http://mirrors.ivolces.com/ubuntu \
            --build-arg BRANCH_TYPE=local \
            --build-arg GRACE_BLACKWELL=0 \
            --build-arg HOPPER_SBO=0 \
            --build-arg INSTALL_FLASHINFER_JIT_CACHE=1 \
            --build-arg INSTALL_LOCAL_SGL_KERNEL_WHEEL=0 \
            --build-arg W4A8_PER_TENSOR_TRANSFER=0 \
            --build-arg "CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)" \
            --build-arg HTTP_PROXY=http://100.68.162.211:3128 \
            --build-arg HTTPS_PROXY=http://100.68.162.211:3128 \
            --build-arg ALL_PROXY=http://100.68.162.211:3128 \
            --build-arg NO_PROXY=localhost,127.0.0.1,::1,mirrors.ivolces.com,.ivolces.com,.volceapi.com,.byted.org,eic-sdk-release.tos-cn-beijing.ivolces.com,scqq9isgq31i0fb8nt4eg.apigateway-cn-beijing.volceapi.com,bytedpypi.byted.org,mirrors.byted.org,iaas-gpu-cn-beijing.cr.volces.com \
            --build-arg "BYTED_INTERNAL_EXTRA_TOOLS_APT_URL=${{ vars.BYTED_INTERNAL_EXTRA_TOOLS_APT_URL || 'http://mirrors.ivolces.com/extra-tools/ubuntu' }}" \
            --build-arg "BYTED_INTERNAL_EXTRA_TOOLS_GPG_URL=${{ vars.BYTED_INTERNAL_EXTRA_TOOLS_GPG_URL || 'https://mirrors.ivolces.com/extra-tools/ubuntu/GPG-KEY-system' }}" \
            --build-arg "SGLANG_BUILD_COMMIT=$SOURCE_COMMIT" \
            --build-arg "SGLANG_BUILD_TREE=$SOURCE_TREE" \
            --build-arg "SGLANG_PYTHON_MANIFEST_SHA256=${{ steps.identity.outputs.python_manifest_sha256 }}" \
            --build-arg "SGLANG_BUILD_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg "SGLANG_BUILD_URL=$build_url" \
            --build-arg "SGLANG_IMAGE_TAG=$IMAGE_REPO:$IMAGE_TAG" \
            --metadata-file /tmp/glm53-image-metadata.json \
            --no-cache \
            .
          digest="$(python3 -c 'import json; print(json.load(open("/tmp/glm53-image-metadata.json"))["containerimage.digest"])')"
          docker buildx imagetools create --tag "$IMAGE_REPO:$IMAGE_TAG" "$IMAGE_REPO@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REPO@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify immutable image and runtime
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${{ steps.build.outputs.image_ref }}"
          docker buildx imagetools inspect "$image_ref"
          docker pull "$image_ref"
          docker run --rm \
            -e "EXPECTED_BUILD_COMMIT=$SOURCE_COMMIT" \
            -e "EXPECTED_BUILD_TREE=$SOURCE_TREE" \
            -e "EXPECTED_PYTHON_MANIFEST_SHA256=${{ steps.identity.outputs.python_manifest_sha256 }}" \
            -e EXPECTED_MOONCAKE_VERSION=0.3.11.post1 \
            --entrypoint bash "$image_ref" -lc '
              set -euo pipefail
              test "$SGLANG_BUILD_COMMIT" = "$EXPECTED_BUILD_COMMIT"
              test "$SGLANG_BUILD_TREE" = "$EXPECTED_BUILD_TREE"
              test "$SGLANG_PYTHON_MANIFEST_SHA256" = "$EXPECTED_PYTHON_MANIFEST_SHA256"
              test -f python/sglang/kernels/jit/csrc/deepseek_v4/topk_v2.cuh
              test -f python/sglang/kernels/jit/include/sgl_kernel/deepseek_v4/topk_impl.cuh
              command -v oniond
              python3 scripts/ci/verify_private_image_runtime.py
              sha256sum python/sglang/srt/disaggregation/mooncake/conn.py \
                python/sglang/srt/disaggregation/mooncake/registration.py \
                python/sglang/srt/distributed/device_communicators/mooncake_transfer_engine.py \
                /sgl-workspace/mooncake-constraints.txt
              python3 -m pytest -q test/registered/unit/disaggregation/test_mooncake_buffer_registration.py
              python3 -m py_compile python/sglang/kernels/ops/attention/dsv4/topk.py
              python3 -m pytest -q test/registered/unit/test_runtime_context.py -k TestMoeFlagsGroup
            '

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo '### GLM-5.3 clean image'
            echo
            echo "- Source: \`$SOURCE_COMMIT\`"
            echo "- Tree: \`$SOURCE_TREE\`"
            echo "- Build definition: \`$BUILD_DEFINITION_COMMIT\`"
            echo "- Image: \`$IMAGE_REPO:$IMAGE_TAG\`"
            echo "- Immutable ref: \`${{ steps.build.outputs.image_ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
