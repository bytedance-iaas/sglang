name: BytePypi read-only access audit
run-name: BytePypi read-only access audit
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: bytedance-x64-docker-build-node
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'bytedance-iaas/sglang'
    runs-on: x64-docker-build-node
    timeout-minutes: 5
    steps:
      - name: Check package indexes and download a public control wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          import html.parser
          import io
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile

          BASE = "https://bytedpypi.byted.org"
          INDEX = BASE + "/repository/pypi-group/simple/"
          # Explicitly use direct network access, with no pip/netrc credentials or secrets.
          OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          RESULTS = []

          class Links(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.urls.extend(v for k, v in attrs if k == "href")

          def get(label, url, limit):
              row = {"check": label, "explicit_credentials": False}
              RESULTS.append(row)
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "pip/25.2"})
                  response = OPENER.open(request, timeout=15)
              except urllib.error.HTTPError as error:
                  response = error
              except Exception as error:
                  row.update(error_type=type(error).__name__)
                  return row, b""
              with response:
                  row.update(http_status=response.status,
                             auth_challenge=bool(response.headers.get("WWW-Authenticate")))
                  body = response.read(limit + 1)
              if len(body) > limit:
                  row["error_type"] = "ResponseTooLarge"
                  return row, b""
              return row, body

          index_row, index_body = get("packaging_index", INDEX + "packaging/", 1024 * 1024)
          get("iaas_kernels_index", INDEX + "iaas-kernels/", 64 * 1024)
          if index_row.get("http_status") == 200:
              links = Links()
              links.feed(index_body.decode("utf-8"))
              selected = None
              for link in links.urls:
                  url = urllib.parse.urljoin(INDEX + "packaging/", link)
                  parts = urllib.parse.urlsplit(url)
                  if (parts.scheme == "https" and parts.netloc == "bytedpypi.byted.org"
                          and parts.path.endswith("/packaging-25.0-py3-none-any.whl")):
                      selected = url
                      break
              if selected is not None:
                  row, wheel = get("packaging_wheel_download", selected, 2 * 1024 * 1024)
                  if row.get("http_status") == 200 and wheel:
                      row.update(bytes=len(wheel), sha256=hashlib.sha256(wheel).hexdigest())
                      expected = urllib.parse.parse_qs(urllib.parse.urlsplit(selected).fragment).get("sha256", [])
                      row["index_hash_matches"] = bool(expected and expected[0] == row["sha256"])
                      try:
                          with zipfile.ZipFile(io.BytesIO(wheel)) as archive:
                              row["valid_wheel"] = any(n.endswith(".dist-info/WHEEL") for n in archive.namelist())
                      except zipfile.BadZipFile:
                          row["valid_wheel"] = False
              else:
                  RESULTS.append({"check": "packaging_wheel_download", "error_type": "PinnedWheelNotListed"})
          print(json.dumps({"audit": "bytedpypi_read_access", "checks": RESULTS}, sort_keys=True))
          PYCODE
