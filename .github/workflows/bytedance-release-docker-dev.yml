name: iaas-kernels PAT read access check
run-name: iaas-kernels PAT read access check
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: iaas-kernels-pat-read-check
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'bytedance-iaas/sglang'
    runs-on: x64-docker-build-node
    timeout-minutes: 5
    steps:
      - name: Verify repository PAT can fetch the pinned iaas-kernels revision
        env:
          IAAS_KERNELS_READ_TOKEN: ${{ secrets.IAAS_KERNELS_READ_TOKEN }}
          HTTP_PROXY: http://100.68.162.211:3128
          HTTPS_PROXY: http://100.68.162.211:3128
          NO_PROXY: localhost,127.0.0.1,::1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          REPOSITORY = "https://github.com/bytedance-iaas/iaas-kernels.git"
          REVISION = "aafe99be98b7af1ab92e75e36315f0cc74e9c642"
          token = os.environ.get("IAAS_KERNELS_READ_TOKEN", "").strip()
          if not token:
              raise SystemExit("IAAS_KERNELS_READ_TOKEN is not available to this CI job")
          auth = base64.b64encode(("x-access-token:" + token).encode()).decode()
          print("::add-mask::" + auth, flush=True)
          env = os.environ.copy()
          env.pop("IAAS_KERNELS_READ_TOKEN", None)
          for key in list(env):
              if key.startswith("GIT_TRACE") or key.startswith("GIT_CONFIG_") or key == "GIT_CURL_VERBOSE":
                  env.pop(key)
          env.update({
              "GIT_CONFIG_NOSYSTEM": "1",
              "GIT_CONFIG_GLOBAL": "/dev/null",
              "GIT_TERMINAL_PROMPT": "0",
              "GIT_ASKPASS": "/bin/false",
              "GIT_CONFIG_COUNT": "2",
              "GIT_CONFIG_KEY_0": "credential.helper",
              "GIT_CONFIG_VALUE_0": "",
              "GIT_CONFIG_KEY_1": "http." + REPOSITORY + ".extraheader",
              "GIT_CONFIG_VALUE_1": "AUTHORIZATION: basic " + auth,
          })

          def git(directory, *args):
              try:
                  result = subprocess.run(["git", "-C", str(directory), *args],
                                          env=env, capture_output=True, text=True, timeout=120)
              except subprocess.TimeoutExpired:
                  raise SystemExit("Git operation timed out")
              if result.returncode:
                  detail = (result.stderr + result.stdout).lower()
                  if any(word in detail for word in ["authentication failed", "403", "401", "repository not found"]):
                      category = "authentication_or_repository_access_failed"
                  elif any(word in detail for word in ["resolve", "connect", "proxy", "ssl", "tls"]):
                      category = "network_or_tls_failure"
                  else:
                      category = "git_operation_failed"
                  # Do not print raw subprocess output or any private source contents.
                  print(json.dumps({"check": "iaas_git_read", "ok": False,
                                    "operation": args[0], "category": category,
                                    "exit_code": result.returncode}), flush=True)
                  raise SystemExit(1)
              return result.stdout.strip()

          with tempfile.TemporaryDirectory(prefix="iaas-pat-read-", dir=os.environ.get("RUNNER_TEMP")) as directory:
              git(directory, "init", "--quiet")
              git(directory, "remote", "add", "origin", REPOSITORY)
              git(directory, "fetch", "--quiet", "--depth=1", "origin", REVISION)
              actual = git(directory, "rev-parse", "FETCH_HEAD")
              if actual != REVISION:
                  raise SystemExit("Fetched commit does not match the image lock")
              for name in ["pyproject.toml", "build_sgl_deep_gemm.sh", ".gitmodules"]:
                  git(directory, "cat-file", "-e", actual + ":" + name)
              # Only non-secret, already pinned provenance is emitted to this public log.
              result = {"check": "iaas_git_read", "ok": True, "secret_available": True,
                        "https_fetch": True, "revision": actual,
                        "required_build_files_present": True}
          print(json.dumps(result, sort_keys=True))
          PYCODE
