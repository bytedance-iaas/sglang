name: iaas-kernels image build validation
run-name: iaas-kernels image build validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iaas-kernels-isolated-image-validation
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'bytedance-iaas/sglang'
    runs-on: x64-docker-build-node
    timeout-minutes: 240
    env:
      SOURCE_COMMIT: 7595f52c35a04efcc2d3ed84117cb82d0cdad718
      SOURCE_DIR: validation-source-${{ github.run_id }}-${{ github.run_attempt }}
      RESULT_DIR: /tmp/iaas-image-${{ github.run_id }}-${{ github.run_attempt }}
      IMAGE_BASE: iaas-image-validation:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the exact integration PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: ${{ env.SOURCE_DIR }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Check source and disk capacity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESULT_DIR"
          cd "$SOURCE_DIR"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 -m unittest discover -s scripts/ci -p test_iaas_kernels_image.py -v
          df -h / "$RUNNER_TEMP" | tee "$RESULT_DIR/disk-before.txt"
          available_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          test "$available_kb" -ge 157286400
          docker version --format '{{.Server.Version}}'
          docker buildx version
      - name: Reuse or create the persistent image builder
        shell: bash
        run: |
          set -euo pipefail
          if ! docker buildx inspect sgl-private-image-builder >/dev/null 2>&1; then
            cat > "$RESULT_DIR/buildkitd.toml" <<'EOF'
          [registry."docker.io"]
            mirrors = ["127.0.0.1:5000"]
          [worker.oci]
            gc = true
            reservedSpace = "10GB"
            maxUsedSpace = "100GB"
            minFreeSpace = "150GB"
          EOF
            docker buildx create --name sgl-private-image-builder \
              --driver docker-container --driver-opt network=host \
              --buildkitd-config "$RESULT_DIR/buildkitd.toml"
          fi
          docker buildx inspect --bootstrap sgl-private-image-builder
      - name: Prepare build commands and provenance
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          digest=hashlib.sha256()
          paths=subprocess.check_output(['git','ls-files','-z','--','python']).split(b'\0')
          for raw in sorted(p for p in paths if p):
              digest.update(raw+b'\0')
              digest.update(hashlib.sha256(Path(os.fsdecode(raw)).read_bytes()).digest())
          values={
              'SGLANG_BUILD_COMMIT':os.environ['SOURCE_COMMIT'],
              'SGLANG_BUILD_TREE':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'SGLANG_PYTHON_MANIFEST_SHA256':digest.hexdigest(),
              'SGLANG_BUILD_SOURCE':'https://github.com/bytedance-iaas/sglang',
              'SGLANG_BUILD_URL':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
          }
          output=Path(os.environ['RESULT_DIR'])
          (output/'provenance.json').write_text(json.dumps(values,indent=2)+'\n')
          (output/'metadata.args').write_text(''.join('--build-arg\n'+k+'='+v+'\n' for k,v in values.items()))
          PYCODE
          python3 - <<'PYCODE'
          import json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['RESULT_DIR'])
          args=json.loads((root/'provenance.json').read_text())
          no_proxy='localhost,127.0.0.1,::1,archive.ubuntu.com,security.ubuntu.com,mirrors.ivolces.com,.ivolces.com,.volceapi.com,.byted.org,eic-sdk-release.tos-cn-beijing.ivolces.com,scqq9isgq31i0fb8nt4eg.apigateway-cn-beijing.volceapi.com,bytedpypi.byted.org,mirrors.byted.org,iaas-gpu-cn-beijing.cr.volces.com'
          args.update({
              'CUDA_VERSION':'13.0.3','BUILD_TYPE':'all','BRANCH_TYPE':'local',
              'INSTALL_IAAS_KERNELS':'1','INSTALL_FLASHINFER_JIT_CACHE':'1',
              'INSTALL_LOCAL_SGL_KERNEL_WHEEL':'0','INSTALL_AI_DYNAMO':'0','INSTALL_ONION':'1',
              'CMAKE_BUILD_PARALLEL_LEVEL':subprocess.check_output(['nproc'],text=True).strip(),
              'HTTP_PROXY':'http://100.68.162.211:3128','HTTPS_PROXY':'http://100.68.162.211:3128',
              'ALL_PROXY':'http://100.68.162.211:3128','NO_PROXY':no_proxy,'no_proxy':no_proxy,
              'UBUNTU_MIRROR':'https://archive.ubuntu.com',
              'BYTED_INTERNAL_EXTRA_TOOLS_APT_URL':'http://mirrors.ivolces.com/extra-tools/ubuntu',
              'BYTED_INTERNAL_EXTRA_TOOLS_GPG_URL':'https://mirrors.ivolces.com/extra-tools/ubuntu/GPG-KEY-system',
          })
          targets={}
          for target in ('iaas_kernels_wheel','framework_final','runtime'):
              config={
                  'context':'.','dockerfile':'docker/Dockerfile','target':target,
                  'platforms':['linux/amd64'],'args':args,
                  'secret':['id=iaas_kernels_token,env=IAAS_KERNELS_READ_TOKEN'],
              }
              if target=='iaas_kernels_wheel':
                  config['output']=['type=local,dest='+str(root/'private-wheel')]
              else:
                  config['output']=['type=docker']
                  config['tags']=[os.environ['IMAGE_BASE']+'-'+target]
              targets[target]=config
          bake={'group':{'default':{'targets':list(targets)}},'target':targets}
          (root/'docker-bake.json').write_text(json.dumps(bake,indent=2)+'\n')
          PYCODE
          cat > "$RESULT_DIR/progress.py" <<'PYCODE'
          import re,sys
          from pathlib import Path
          steps={}
          finished=set()
          for line in sys.stdin:
              print(line,end='',flush=True)
              match=re.match(r'(#\d+) \[([^\]]+) (\d+)/(\d+)\]',line)
              if match:
                  steps[match[1]]=(match[2],int(match[3])==int(match[4]))
              done=re.match(r'(#\d+) DONE ([0-9.]+)s',line)
              if done and done[1] in steps:
                  label,is_last=steps[done[1]]
                  if is_last and label not in finished:
                      finished.add(label)
                      message='Completed stage '+label+' (last step '+done[2]+'s)'
                      message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                      print('::notice title=Image build progress::'+message,flush=True)
          PYCODE
          cat > "$RESULT_DIR/build.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${IAAS_KERNELS_READ_TOKEN:?repository secret is required}"
          cd "$GITHUB_WORKSPACE/$SOURCE_DIR"
          docker buildx bake --builder sgl-private-image-builder \
            --file "$RESULT_DIR/docker-bake.json" --print > "$RESULT_DIR/bake-resolved.json"
          docker buildx bake --builder sgl-private-image-builder \
            --file "$RESULT_DIR/docker-bake.json" --progress plain \
            --metadata-file "$RESULT_DIR/bake-metadata.json" \
            --allow "fs.write=$RESULT_DIR/private-wheel" \
            2>&1 | tee "$RESULT_DIR/images-build.log" | python3 -u "$RESULT_DIR/progress.py"
          BASH
          chmod +x "$RESULT_DIR/build.sh"
      - name: Record builder cache before the build
        run: |
          set -euo pipefail
          docker buildx du --builder sgl-private-image-builder > "$RESULT_DIR/builder-cache-before.txt"
          docker system df > "$RESULT_DIR/docker-disk-before.txt"
      - name: Build wheel and both images with shared dependencies
        env:
          IAAS_KERNELS_READ_TOKEN: ${{ secrets.IAAS_KERNELS_READ_TOKEN }}
        run: bash "$RESULT_DIR/build.sh"
      - name: Record wheel provenance without uploading private binaries
        run: |
          set -euo pipefail
          cp "$RESULT_DIR/private-wheel/manifest.json" "$RESULT_DIR/wheel-manifest.json"
          cp "$RESULT_DIR/private-wheel/iaas-kernels.lock.json" "$RESULT_DIR/iaas-kernels.lock.json"
          python3 - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RESULT_DIR'])
          manifest=json.loads((root/'wheel-manifest.json').read_text())
          wheel=root/'private-wheel'/manifest['wheel']
          assert hashlib.sha256(wheel.read_bytes()).hexdigest()==manifest['wheel_sha256']
          print(json.dumps({'wheel':wheel.name,'sha256':manifest['wheel_sha256'],'revision':manifest['lock']['revision']}))
          PYCODE
      - name: Verify framework image
        run: |
          set -euo pipefail
          image="${IMAGE_BASE}-framework_final"
          docker run --rm --entrypoint python3 "$image" \
            /sgl-workspace/sglang/scripts/ci/check_iaas_kernels_image.py \
            | tee "$RESULT_DIR/framework-smoke.json"
          docker run --rm --entrypoint python3 "$image" \
            /sgl-workspace/sglang/scripts/ci/verify_private_image_runtime.py \
            | tee "$RESULT_DIR/framework-private-runtime.txt"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "ai.sglang.build.commit"}}')" = "$SOURCE_COMMIT"
          docker image inspect "$image" --format '{{.Id}}' | tee "$RESULT_DIR/framework-image-id.txt"
      - name: Verify runtime image
        run: |
          set -euo pipefail
          image="${IMAGE_BASE}-runtime"
          docker run --rm --entrypoint python3 "$image" \
            /sgl-workspace/sglang/scripts/ci/check_iaas_kernels_image.py \
            | tee "$RESULT_DIR/runtime-smoke.json"
          docker run --rm --entrypoint python3 "$image" \
            /sgl-workspace/sglang/scripts/ci/verify_private_image_runtime.py \
            | tee "$RESULT_DIR/runtime-private-runtime.txt"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "ai.sglang.build.commit"}}')" = "$SOURCE_COMMIT"
          docker image inspect "$image" --format '{{.Id}}' | tee "$RESULT_DIR/runtime-image-id.txt"
      - name: Upload build logs and verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iaas-image-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RESULT_DIR }}/*.log
            ${{ env.RESULT_DIR }}/*.json
            ${{ env.RESULT_DIR }}/*.txt
            ${{ env.RESULT_DIR }}/build.sh
            ${{ env.RESULT_DIR }}/progress.py
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary exported private wheel
        if: always()
        run: |
          set -euo pipefail
          rm -rf -- "$RESULT_DIR/private-wheel"
