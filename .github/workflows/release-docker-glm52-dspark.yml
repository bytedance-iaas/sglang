name: Build GLM 5.2 DSpark Overlay Image

on:
  workflow_call:
    inputs:
      image_tag:
        description: Immutable task image tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable task image tag
        required: true
        default: glm52-dspark-deepep-ac2b79fd4-eic1.5.2

concurrency:
  group: glm52-dspark-overlay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bytedance-iaas/sglang'
    environment: prod
    runs-on: x64-docker-build-node
    env:
      IMAGE_REPO: iaas-gpu-cn-beijing.cr.volces.com/serving/sglang
      REGISTRY_HOST: iaas-gpu-cn-beijing.cr.volces.com
      VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
      VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
      BASE_IMAGE: iaas-gpu-cn-beijing.cr.volces.com/serving/sglang:glm52-dp8-pppoll-5668722414-eic1.5.2@sha256:a322afaa9aa032810aa559d2497ed57fe91b71ac6d470c8b843923fadf7075d3
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Cleanup workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout exact task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and validate source provenance
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git write-tree)"
          mkdir -p .ci-artifacts
          git ls-files 'python/sglang/**/*.py' | LC_ALL=C sort \
            > .ci-artifacts/glm52-dspark-python-files.txt
          source_python_sha256="$(
            while IFS= read -r source_file; do
              source_hash="$(sha256sum "$source_file" | awk '{print $1}')"
              printf '%s %s\n' "$source_hash" "$source_file"
            done < .ci-artifacts/glm52-dspark-python-files.txt | \
              sha256sum | awk '{print $1}'
          )"
          test "$source_python_sha256" = \
            '189fb9071bc3efd13feaba142254c761de21c7432c93d1e2b388703a1e0a87a8'
          echo "source_commit=${source_commit}" >> "$GITHUB_OUTPUT"
          echo "source_tree=${source_tree}" >> "$GITHUB_OUTPUT"
          echo "source_python_sha256=${source_python_sha256}" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_COMMIT=%s\nSOURCE_TREE=%s\nSOURCE_PYTHON_SHA256=%s\n' \
            "$source_commit" "$source_tree" "$source_python_sha256"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["127.0.0.1:5000"]

      - name: Login to Volcengine CR
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VOLCENGINE_CR_USERNAME"
          test -n "$VOLCENGINE_CR_PASSWORD"
          echo "$VOLCENGINE_CR_PASSWORD" | docker login "$REGISTRY_HOST" \
            --username "$VOLCENGINE_CR_USERNAME" --password-stdin

      - name: Build and publish immutable overlay
        id: image
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          SOURCE_TREE: ${{ steps.source.outputs.source_tree }}
          SOURCE_PYTHON_SHA256: ${{ steps.source.outputs.source_python_sha256 }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REPO}:${{ inputs.image_tag }}"
          docker buildx build \
            --platform linux/amd64 \
            --file docker/glm52-dspark-overlay.Dockerfile \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" \
            --build-arg SOURCE_TREE="$SOURCE_TREE" \
            --build-arg SOURCE_PYTHON_SHA256="$SOURCE_PYTHON_SHA256" \
            --build-arg HTTP_PROXY=http://100.68.162.211:3128 \
            --build-arg HTTPS_PROXY=http://100.68.162.211:3128 \
            --build-arg NO_PROXY=localhost,127.0.0.1,.ivolces.com,.volceapi.com,.byted.org,iaas-gpu-cn-beijing.cr.volces.com \
            --metadata-file /tmp/glm52-dspark-image-metadata.json \
            --push \
            --tag "$image_ref" \
            .
          digest="$(python3 -c 'import json; print(json.load(open("/tmp/glm52-dspark-image-metadata.json"))["containerimage.digest"])')"
          test -n "$digest"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_REF=%s\nIMAGE_DIGEST=%s\n' "$image_ref" "$digest"

      - name: Verify published digest and labels
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          inspected="$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}')"
          printf '%s\n' "$inspected"
          docker buildx imagetools inspect "${IMAGE_REF}@${IMAGE_DIGEST}"
