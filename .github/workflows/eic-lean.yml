name: EIC Lean spec

on:
  pull_request:
    branches: [ep_main]
    paths:
      - "lean/eic/**"
      - "python/sglang/srt/mem_cache/eic_*.py"
      - "python/sglang/srt/mem_cache/hiradix_cache.py"
      - "python/sglang/srt/mem_cache/radix_cache.py"
      - "test/registered/unit/mem_cache/test_eic_lean_spec.py"
      - ".github/workflows/eic-lean.yml"
  workflow_dispatch:

jobs:
  eic-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check proofs and build the replayer
        working-directory: lean/eic
        run: lake build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ponytail: the import closure of eic_hiradix_cache on CPU, not python[dev];
      # widen it if an import error shows up here.
      - name: Install Python deps
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==5.12.1" orjson psutil pybase64 requests pillow \
            starlette IPython pydantic aiohttp msgspec pyzmq dill einops \
            compressed_tensors gguf openai partial_json_parser xgrammar sentencepiece

      - name: Differential test against the spec
        env:
          PYTHONPATH: python
          EIC_REPLAY: lean/eic/.lake/build/bin/eic_replay
        run: python test/registered/unit/mem_cache/test_eic_lean_spec.py -v
