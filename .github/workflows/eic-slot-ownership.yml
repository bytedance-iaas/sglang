name: EIC slot ownership

on:
  pull_request:
    branches: [ep_main]
    paths:
      - "python/sglang/srt/mem_cache/eic_*.py"
      - "python/sglang/srt/mem_cache/hiradix_cache.py"
      - "python/sglang/srt/mem_cache/radix_cache.py"
      - "test/registered/unit/mem_cache/test_eic_slot_ownership.py"
      - ".github/workflows/eic-slot-ownership.yml"
  workflow_dispatch:

jobs:
  eic-slot-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ponytail: the import closure of eic_hiradix_cache on CPU, not python[dev];
      # widen it if an import error shows up here.
      - name: Install Python deps
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==5.12.1" orjson psutil pybase64 requests pillow \
            starlette IPython pydantic aiohttp msgspec pyzmq dill einops \
            compressed_tensors gguf openai partial_json_parser xgrammar sentencepiece

      - name: Slot-ownership property test
        env:
          PYTHONPATH: python
        run: python test/registered/unit/mem_cache/test_eic_slot_ownership.py -v
