name: Build GLM-5.3-Flash fixed-environment image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/glm53-flash-image
      - poc_glm5.3-flash
    paths:
      - .github/workflows/glm53-flash-image.yml
      - docker/glm53-flash*
      - scripts/ci/*glm53*image*

permissions:
  contents: read

concurrency:
  group: glm53-flash-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bytedance-iaas/sglang'
    environment: prod
    runs-on: [self-hosted, x64-docker-build-node]
    timeout-minutes: 180
    env:
      BUILD_DOWNLOAD_PROXY: http://100.68.162.211:3128
      NO_PROXY: localhost,127.0.0.1,::1,.cr.volces.com,.ivolces.com,.volceapi.com,.byted.org
    steps:
      - name: Set task directories
        run: |
          printf 'GLM53_BUILD_DIR=%s/glm53-flash-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s/glm53-docker-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Check out exact task commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source-${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false

      - name: Log in to private registry
        env:
          CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
          CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          for attempt in 1 2 3; do
            if printf '%s' "$CR_PASSWORD" | timeout 60 docker login iaas-gpu-cn-beijing.cr.volces.com --username "$CR_USERNAME" --password-stdin; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Set up isolated Buildx builder
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
            env.NO_PROXY=.cr.volces.com
            env.no_proxy=.cr.volces.com

      - name: Build, publish, and verify registry digest
        id: build
        working-directory: source-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci/build_glm53_flash_image.sh

      - name: Preserve source and registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glm53-flash-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.GLM53_BUILD_DIR }}/identity.json
            ${{ env.GLM53_BUILD_DIR }}/context/source.json
            ${{ env.GLM53_BUILD_DIR }}/build-metadata.json
            ${{ env.GLM53_BUILD_DIR }}/registry-manifest.json
            ${{ env.GLM53_BUILD_DIR }}/result.env
          if-no-files-found: warn

      - name: Remove task credentials and context
        if: always()
        run: |
          rm -rf -- "$DOCKER_CONFIG" "$GLM53_BUILD_DIR"
