name: Bytedance Build SGLang Kernel Artifact

on:
  workflow_call:
    outputs:
      kernel_tos_uri:
        description: "Immutable TOS object containing the built kernel wheel"
        value: ${{ jobs.build-wheel.outputs.kernel_tos_uri }}
      kernel_wheel_sha256:
        description: "SHA-256 of the wheel uploaded to TOS"
        value: ${{ jobs.build-wheel.outputs.kernel_wheel_sha256 }}
    secrets:
      TOSUTIL_CONFIG_B64:
        required: true
    inputs:
      checkout_ref:
        description: "Git ref to build from"
        required: true
        type: string
      python_version:
        description: "Python version passed to sgl-kernel/build.sh"
        required: false
        type: string
        default: "3.10"
      cuda_version:
        description: "CUDA version passed to sgl-kernel/build.sh"
        required: true
        type: string
      arch:
        description: "Optional architecture override passed to sgl-kernel/build.sh"
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Uploaded artifact name"
        required: true
        type: string
      runner:
        description: "Runner label for the wheel build"
        required: false
        type: string
        default: "x64-kernel-build-node"
      build_jobs:
        description: "BUILD_JOBS passed to sgl-kernel/build.sh"
        required: false
        type: string
        default: "64"
      nvcc_threads:
        description: "NVCC_THREADS passed to sgl-kernel/build.sh"
        required: false
        type: string
        default: "8"
      use_ccache:
        description: "USE_CCACHE passed to sgl-kernel/build.sh"
        required: false
        type: string
        default: "1"
      concurrency_group:
        description: "Concurrency group for callers that share a build resource"
        required: false
        type: string
        default: "bytedance-x64-kernel-build-node"
      tos_bucket:
        description: "TOS bucket for run-scoped kernel wheel transport"
        required: false
        type: string
        default: "ai-infra"
      tos_endpoint:
        description: "TOS endpoint used by build runners"
        required: false
        type: string
        default: "tos-cn-beijing.volces.com"
      tos_region:
        description: "TOS region used by build runners"
        required: false
        type: string
        default: "cn-beijing"
      tos_prefix:
        description: "TOS object prefix for run-scoped kernel wheels"
        required: false
        type: string
        default: "sglang-ci/kernel-wheels"

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

jobs:
  build-wheel:
    environment: prod
    runs-on: ${{ inputs.runner }}
    outputs:
      kernel_tos_uri: ${{ steps.tos-upload.outputs.kernel_tos_uri }}
      kernel_wheel_sha256: ${{ steps.tos-upload.outputs.kernel_wheel_sha256 }}
    env:
      SGL_KERNEL_BUILDER_NAME: sgl-kernel-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.artifact_name }}
      BUILDKITD_CONFIG: /tmp/sgl-kernel-buildkitd.toml
    steps:
      - name: Clean workspace
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" alpine:3 \
            sh -c 'rm -rf /workspace/..?* /workspace/.[!.]* /workspace/*' || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Reclaim disposable caches and require build capacity
        run: |
          chmod +x scripts/ci/cleanup_build_runner_disk.sh
          scripts/ci/cleanup_build_runner_disk.sh --required-gb 50
          cat > "${BUILDKITD_CONFIG}" <<'EOF'
          [registry."docker.io"]
            mirrors = ["127.0.0.1:5000"]

          [worker.oci]
            gc = true
            reservedSpace = "5GB"
            maxUsedSpace = "30GB"
            minFreeSpace = "50GB"
          EOF

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build wheel
        run: |
          cd python/sglang/kernels/aot
          chmod +x ./build.sh
          if [ -n "${{ inputs.arch }}" ]; then
            ./build.sh "${{ inputs.python_version }}" "${{ inputs.cuda_version }}" "${{ inputs.arch }}"
          else
            ./build.sh "${{ inputs.python_version }}" "${{ inputs.cuda_version }}"
          fi
        env:
          BUILD_JOBS: ${{ inputs.build_jobs }}
          NVCC_THREADS: ${{ inputs.nvcc_threads }}
          USE_CCACHE: "0"
          USE_LOCAL_BUILDX_CACHE: "0"
          BUILDKIT_DRIVER_OPT: "network=host"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: python/sglang/kernels/aot/dist/*
          if-no-files-found: error

      - name: Upload wheel to TOS transport
        id: tos-upload
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          TOS_BUCKET: ${{ inputs.tos_bucket }}
          TOS_ENDPOINT: ${{ inputs.tos_endpoint }}
          TOS_PREFIX: ${{ inputs.tos_prefix }}
          TOS_REGION: ${{ inputs.tos_region }}
          TOSUTIL_CONFIG_B64: ${{ secrets.TOSUTIL_CONFIG_B64 }}
        run: |
          set -euo pipefail
          scripts/ci/install_tosutil.sh
          test -n "$TOSUTIL_CONFIG_B64"
          tos_config="$(mktemp /tmp/tosutil-config.XXXXXX)"
          trap 'rm -f "$tos_config"' EXIT
          printf '%s' "$TOSUTIL_CONFIG_B64" | base64 --decode > "$tos_config"
          chmod 0600 "$tos_config"
          mapfile -t wheels < <(find python/sglang/kernels/aot/dist -maxdepth 1 -type f -name 'sglang_kernel-*.whl' -print)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one built sglang_kernel wheel"
            exit 1
          fi
          wheel="${wheels[0]}"
          wheel_sha256="$(sha256sum "$wheel" | awk '{print $1}')"
          object_key="${TOS_PREFIX}/${GITHUB_REPOSITORY_ID}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/${ARTIFACT_NAME}/$(basename "$wheel")"
          tos_uri="tos://${TOS_BUCKET}/${object_key}"
          timeout 20m tosutil cp "$wheel" "$tos_uri" \
            -e="$TOS_ENDPOINT" -re="$TOS_REGION" \
            -p=8 -threshold=52428800 -ps=16777216 -vchecksum \
            -conf="$tos_config"
          {
            echo "kernel_tos_uri=${tos_uri}"
            echo "kernel_wheel_sha256=${wheel_sha256}"
          } >> "$GITHUB_OUTPUT"
          echo "Uploaded verified kernel wheel transport for run ${GITHUB_RUN_ID}"

      - name: Remove run-scoped BuildKit state
        if: always()
        run: |
          docker buildx rm "${SGL_KERNEL_BUILDER_NAME}" || true
          docker image prune -af || true
          df -h /
