apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm53-b300-opt
  namespace: vketest
  labels:
    ai-infra/task: glm53-b300-opt
    ai-infra/role: server
spec:
  replicas: 1
  progressDeadlineSeconds: 2100
  strategy:
    type: Recreate
  selector:
    matchLabels:
      ai-infra/task: glm53-b300-opt
      ai-infra/role: server
  template:
    metadata:
      labels:
        ai-infra/task: glm53-b300-opt
        ai-infra/role: server
    spec:
      nodeSelector:
        kubernetes.io/hostname: 8.46.0.236
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
      - name: server
        image: iaas-gpu-cn-beijing.cr.volces.com/serving/sglang@sha256:27d8f8e072165e7deff4d665b2193a9c6812457679d30ce5da31ecccaa840d3e
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -m
        - sglang.launch_server
        args:
        - --model-path
        - /models/GLM-5.3
        - --served-model-name
        - glm-5.3
        - --tp
        - '8'
        - --dtype
        - bfloat16
        - --quantization
        - fp8
        - --attention-backend
        - dsa
        - --kv-cache-dtype
        - fp8_e4m3
        - --dsa-prefill-backend
        - trtllm
        - --dsa-decode-backend
        - trtllm
        - --dsa-topk-backend
        - sgl-kernel
        - --moe-runner-backend
        - deep_gemm
        - --context-length
        - '262144'
        - --mem-fraction-static
        - '0.85'
        - --chunked-prefill-size
        - '32768'
        - --max-running-requests
        - '256'
        - --cuda-graph-max-bs-decode
        - '256'
        - --speculative-algorithm
        - EAGLE
        - --speculative-num-steps
        - '5'
        - --speculative-eagle-topk
        - '1'
        - --speculative-num-draft-tokens
        - '6'
        - --reasoning-parser
        - glm45
        - --tool-call-parser
        - glm47
        - --enable-cache-report
        - --stream-response-default-include-usage
        - --enable-metrics
        - --host
        - 0.0.0.0
        - --port
        - '30000'
        - --enable-prefill-cp
        - --cp-strategy
        - interleave
        - --dsa-paged-mqa-logits-backend
        - cutedsl
        env:
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: HF_HOME
          value: /work/hf
        - name: XDG_CACHE_HOME
          value: /work/cache
        - name: TRITON_CACHE_DIR
          value: /work/triton
        - name: SGLANG_CACHE_DIR
          value: /work/sglang-cache
        resources:
          requests:
            cpu: '64'
            memory: 1Ti
            nvidia.com/gpu: '8'
          limits:
            cpu: '128'
            memory: 1536Gi
            nvidia.com/gpu: '8'
        startupProbe:
          httpGet:
            path: /v1/models
            port: 30000
          periodSeconds: 10
          failureThreshold: 210
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /v1/models
            port: 30000
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - name: model
          mountPath: /models/GLM-5.3
          readOnly: true
        - name: work
          mountPath: /work
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: model
        hostPath:
          path: /data/models/GLM-5.3
          type: Directory
      - name: work
        hostPath:
          path: /data/models/.glm53-b300-opt
          type: Directory
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 64Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glm53-b300-opt
  namespace: vketest
  labels:
    ai-infra/task: glm53-b300-opt
spec:
  type: ClusterIP
  selector:
    ai-infra/task: glm53-b300-opt
    ai-infra/role: server
  ports:
  - name: http
    port: 30000
    targetPort: 30000
---
apiVersion: v1
kind: Pod
metadata:
  name: glm53-b300-opt-client
  namespace: vketest
  labels:
    ai-infra/task: glm53-b300-opt
    ai-infra/role: client
spec:
  nodeSelector:
    kubernetes.io/hostname: 8.46.0.236
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
  - name: client
    image: iaas-gpu-cn-beijing.cr.volces.com/serving/sglang@sha256:27d8f8e072165e7deff4d665b2193a9c6812457679d30ce5da31ecccaa840d3e
    imagePullPolicy: IfNotPresent
    command:
    - sleep
    - infinity
    env:
    - name: NVIDIA_VISIBLE_DEVICES
      value: void
    resources:
      requests:
        cpu: '2'
        memory: 8Gi
      limits:
        cpu: '4'
        memory: 32Gi
    volumeMounts:
    - name: model
      mountPath: /models/GLM-5.3
      readOnly: true
    - name: work
      mountPath: /work
  volumes:
  - name: model
    hostPath:
      path: /data/models/GLM-5.3
      type: Directory
  - name: work
    hostPath:
      path: /data/models/.glm53-b300-opt
      type: Directory
